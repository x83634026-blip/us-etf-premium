name: Update market data

on:
  schedule:
    # 收盘后多档触发，确保北京时间 17:00 前一定跑过一次（UTC+8）
    - cron: "35 7 * * 1-5"   # 15:35
    - cron: "0 8 * * 1-5"    # 16:00
    - cron: "25 8 * * 1-5"   # 16:25
    - cron: "50 8 * * 1-5"   # 16:50
    - cron: "20 10 * * 1-5"  # 18:20 兜底
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MICROCAP_LIVE: https://comprehensive-leopon-d9a1f8abbed-1539785154.tcloudbaseapp.com/microcap/microcap-data.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update microcap data (incremental)
        run: python scripts/update_microcap.py

      - name: Update margin / M2 data
        run: python scripts/update_margin.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Tencent CloudBase
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          set -euo pipefail
          npm i -g @cloudbase/cli --registry https://registry.npmmirror.com --silent
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          tcb hosting deploy site / -e "$TCB_ENV_ID"
